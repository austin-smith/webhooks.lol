name: Bug report
description: Report broken behavior, a regression, or a crash.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search open and closed issues first, and keep the report focused on one problem.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what happened and what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction you have.
      placeholder: |
        1.
        2.
        3.

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the browser, OS, webhooks.lol or whlol version, and Node.js version when known.
      placeholder: Chrome on macOS 26, webhooks.lol 1.0, whlol 1.0, Node.js 24

  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add relevant screenshots, recordings, logs, or request examples. Redact sensitive information.
